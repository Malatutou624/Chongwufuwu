name: CD - Build and Push Docker Image

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 构建并推送 Docker 镜像
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn clean test -DskipITs
        env:
          MAVEN_OPTS: "-Xmx1024m"

      # 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 提取元数据（标签、标签等）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # 构建并推送 Docker 镜像
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # 生成构建证明
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      # 输出镜像信息
      - name: Output image info
        run: |
          echo "========================================="
          echo "Docker 镜像构建完成"
          echo "========================================="
          echo "镜像地址: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "镜像标签: ${{ steps.meta.outputs.tags }}"
          echo "镜像 Digest: ${{ steps.build-and-push.outputs.digest }}"
          echo "========================================="

  # 部署到开发环境
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.your-domain.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging server
        run: |
          echo "部署到开发环境..."
          # 这里可以添加 SSH 部署命令
          # 例如：ssh user@staging-server "cd /app && docker-compose pull && docker-compose up -d"
          echo " staging 部署完成（请配置实际部署命令）"

  # 部署到生产环境
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://your-domain.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production server
        run: |
          echo "部署到生产环境..."
          # 这里可以添加 SSH 部署命令
          # 例如：ssh user@production-server "cd /app && docker-compose pull && docker-compose up -d"
          echo " production 部署完成（请配置实际部署命令）"

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 生产环境部署成功！"
          echo "版本: ${{ github.ref_name }}"
          echo "提交: ${{ github.sha }}"
