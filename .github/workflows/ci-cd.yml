name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Run unit tests
      run: mvn clean test -DskipITs

  integration-and-api-tests:
    name: Integration & API Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: chongwufuwu
          MYSQL_ROOT_PASSWORD: Acx20050624
        options: >-
          --health-cmd="mysqladmin ping -u root -pAcx20050624"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    - name: Wait for MySQL
      run: |
        until mysql -h127.0.0.1 -uroot -pAcx20050624 -e "SELECT 1"; do sleep 1; done
      env:
        MYSQL_PWD: Acx20050624

    - name: Run all tests
      run: mvn test -Dspring.profiles.active=test -e
      env:
        SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/chongwufuwu?serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: Acx20050624
        
        # 测试环境关闭 Redis，解决启动失败
        SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration