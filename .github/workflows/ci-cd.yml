name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven
    - name: Run unit tests
      run: mvn clean test -DskipITs

  integration-and-api-tests:
    name: Integration & API Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: chongwufuwu
          MYSQL_ROOT_PASSWORD: Acx20050624
        options: >-
          --health-cmd="mysqladmin ping -u root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    # 关键：等待服务就绪
    - name: Wait for MySQL
      run: |
        until mysql -h127.0.0.1 -uroot -pAcx20050624 -e "SELECT 1"; do sleep 1; done
      env:
        MYSQL_PWD: Acx20050624

    - name: Run all tests
      run: mvn test -Dspring.profiles.active=test
      env:
        # 数据库配置
        SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/chongwufuwu?serverTimezone=GMT%2B8&useSSL=false&allowPublicKeyRetrieval=true
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: Acx20050624
        # Redis配置
        SPRING_REDIS_HOST: 127.0.0.1
        SPRING_REDIS_PORT: 6379
        # OSS配置（测试用空值，避免初始化失败）
        OSS_ENDPOINT: dummy
        OSS_ACCESS_KEY_ID: dummy
        OSS_ACCESS_KEY_SECRET: dummy
        OSS_BUCKET_NAME: dummy